[package]
name = "mah_world_of_todo"
version = "0.1.0"
edition = "2024"
description = "Mohd Arafat Hossain's World of Warcraft themed todo application"
license = "UNLICENSED"
publish = false

[dependencies]
gtk = { package = "gtk4", version = "0.9" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[package.metadata.deb]
depends = "libgtk-4-1, libgstreamer1.0-0, libgstreamer-plugins-base1.0-0"
assets = [
    ["target/release/mah_world_of_todo", "usr/bin/", "755"],
    ["assets/**/*", "usr/share/mah_world_of_todo/assets/", "644"],
]